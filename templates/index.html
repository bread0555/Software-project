<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
            background-color: #f4f4f4;
        }
        input[type="submit"] {
            font-size: 16px;
            padding: 5px 10px;
        }
    </style>
</head>
<body>
    <h1>Pseudocode to Python</h1>
    <form method="POST">
        <textarea id="input_box" name="i_p" placeholder="Enter pseudocode here" rows="10" cols="50">{{ i_p }}</textarea>
        <input type="submit" value="Submit">
    </form>

    {% if o_p %}
        <h2>Converted pseudocode:</h2>
        <pre>{{ o_p }}</pre>
    {% endif %}
</body>
</html>
